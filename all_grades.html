<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>単語一覧</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="all_grades.css">
</head>

<body>
    <!-- header ---------------------->
    <header class="header">
        <h1 class="header-title"><a href="index.html" class="header-title-link">プログラム英語</a></h1>
        <nav class="header-nav">
            <ul class="header-list">
                <li><a href="index.html" class="link">ホーム</a></li>
                <li><a href="all_grades.html" class="link">成績</a></li>
            </ul>
        </nav>
    </header>
    <!-------------------------------->

    <main class="main-container all-grades-container">
        <section>
            <h2 class="all-grades-title">成績</h2>

            <!-- 累計サマリー (all_grades.js が数値を埋めます) -->
            <div class="summary-card" id="summary-card">
                <div class="summary-ring" id="summary-ring" style="--rate: 0" role="img" aria-label="累計正答率">
                    <div class="summary-ring-inner">
                        <span class="summary-rate" id="summary-rate">0%</span>
                        <span class="summary-fraction" id="summary-fraction">0問中0問正解</span>
                    </div>
                </div>
                <ul class="summary-stats">
                    <li>
                        <span class="summary-label">出題</span>
                        <span class="summary-value" id="stat-total">0</span>
                    </li>
                    <li>
                        <span class="summary-label">正解</span>
                        <span class="summary-value is-correct" id="stat-correct">0</span>
                    </li>
                    <li>
                        <span class="summary-label">不正解</span>
                        <span class="summary-value is-wrong" id="stat-wrong">0</span>
                    </li>
                </ul>
            </div>
            <p class="summary-empty" id="summary-empty" hidden>
                まだ回答がありません。クイズを解くとここに成績が表示されます。
            </p>

            <div class="table-wrapper">
                <table class="wordlist">
                    <thead>
                        <tr>
                            <th>単語</th>
                            <th>意味</th>
                            <th>説明</th>
                            <th>回答</th>
                        </tr>
                    </thead>
                    <tbody id="word-table-body">
                        <!-- all_grades.js により全問題が自動描画されます -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="all_grades.js"></script>
</body>

</html>
