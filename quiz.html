<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>クイズ画面</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="quiz.css">
</head>
<body>
    <main class="quiz-container">
        
        <section class="question-box">
            
            <div class="question-number">第1問/10問</div>
            <div class="question-text">一つの話題・内容のまとまりを表す</div>
        </section>
        <section class="answer-container">
            <button class="option-btn" id="option-button">
                <span class="option-num">1</span>main</button>
            <button class="option-btn" id="option-button">
                <span class="option-num">2</span>section</button>
            <button class="option-btn"  id="option-button">
                <span class="option-num">3</span>set</button>
            <button class="option-btn" id="option-button">
                <span class="option-num">4</span>form</button>
        </section>  
    </main>
</body>
</html>
