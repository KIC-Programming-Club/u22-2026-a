<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>クイズ画面</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="quiz.css">
</head>

<body>
    <!-- header ---------------------->
    <header class="header">
        <h1 class="header-title">プログラム英語</h1>
        <nav class="header-nav">
            <ul class="header-list">
                <li><a href="index.html" class="link">ホーム</a></li>
                <li><a href="all_grades.html" class="link">成績</a></li>
            </ul>
        </nav>
    </header>
    <!-------------------------------->

    <main class="main-container">
        
        <section class="question-container">
            <div class="question-number">第1問/10問</div>
            <div class="question-text">一つの話題・内容のまとまりを表す</div>
            <!--概要(説明文)の開閉ボタン。中身は quiz.js が問題ごとに入れ替える。
                words.json を読み込むまでは出す説明が無いので hidden で隠しておく-->
            <button type="button" class="desc-btn" id="desc-btn" hidden
                aria-expanded="false" aria-controls="question-description">説明を見る</button>
            <p class="question-description" id="question-description" hidden></p>
        </section>
        <!--answer buttons---------------------->
        <section class="answer-container">
            <button class="option-btn" id="answer1">
                <span class="option-num">1</span>main
            </button>
            <button class="option-btn" id="answer2">
                <span class="option-num">2</span>section
            </button>
            <button class="option-btn" id="answer3">
                <span class="option-num">3</span>set
            </button>
            <button class="option-btn" id="answer4">
                <span class="option-num">4</span>form
            </button>
        </section> 

        <section class="">

        </section>
        <!--正解表示-->
        <div id="correct-effect">〇</div>
    </main>
    <script src="quiz.js"></script>
</body>
</html>
